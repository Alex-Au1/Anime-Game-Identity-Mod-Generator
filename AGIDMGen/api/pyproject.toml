[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "AGIDMGen"
version = "0.1.0"
authors = [
  { name="Albert Gold", email="AlexXianZhenYuAu@gmail.com" },
]
description = "Generates identity mods (a character's own model, written out as a mod) for 3DMigoto-based anime game mod loaders"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["numpy>=1.26.4", "FixRaidenBoss2>=5.0.0"]

[project.urls]
Homepage = "https://github.com/Alex-Au1/Anime-Game-Identity-Mod-Generator"
Repository = "https://github.com/Alex-Au1/Anime-Game-Identity-Mod-Generator"

# the package sits under 'src/py' so a 'src/cpp' / 'src/cy' layer can sit beside it later, as in AG Remap
[tool.setuptools.packages.find]
where = ["src/py"]

[tool.setuptools.package-data]
AGIDMGen = ["py.typed"]
