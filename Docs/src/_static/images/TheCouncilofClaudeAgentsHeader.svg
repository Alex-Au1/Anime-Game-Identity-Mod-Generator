<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="The Mirror Tower of The Sub-Council of CLAUDE Agents, on its lake, with the parent Council's fortress on the far shore">
  <!-- The Sub-Council's seat: a tower on an islet in a still lake, by moonlight.
       Far off on the left shore stands the parent Council's fortress, still lit
       by its own fire: AGRemap's Council, whose branch this is. The lake is the
       mirror an identity mod is named for: everything in #hdrWorld is reflected
       about the horizon, y=228. -->
  <defs>
    <linearGradient id="hdrSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#03070f"/>
      <stop offset="40%"  stop-color="#081628"/>
      <stop offset="75%"  stop-color="#0f2c40"/>
      <stop offset="100%" stop-color="#17485a"/>
    </linearGradient>
    <linearGradient id="hdrWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f3442"/>
      <stop offset="100%" stop-color="#040f16"/>
    </linearGradient>

    <radialGradient id="hdrMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#bfe6ee" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#bfe6ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hdrMoon" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#e3eef2"/>
      <stop offset="100%" stop-color="#b6cbd3"/>
    </radialGradient>
    <!-- the parent's fire, thrown up into the sky over the far shore -->
    <radialGradient id="hdrLiegeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffb968" stop-opacity="0.42"/>
      <stop offset="42%"  stop-color="#d0641f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d0641f" stop-opacity="0"/>
    </radialGradient>

    <!-- moonlit stone: lit from the moon on the right -->
    <linearGradient id="hdrStone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a1c28"/>
      <stop offset="60%"  stop-color="#153648"/>
      <stop offset="100%" stop-color="#1d4a5c"/>
    </linearGradient>
    <linearGradient id="hdrStoneDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#081722"/>
      <stop offset="100%" stop-color="#12303f"/>
    </linearGradient>
    <linearGradient id="hdrRoof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0b2633"/>
      <stop offset="55%"  stop-color="#1d5361"/>
      <stop offset="100%" stop-color="#3a7d89"/>
    </linearGradient>
    <linearGradient id="hdrTide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#13525c"/>
      <stop offset="100%" stop-color="#072029"/>
    </linearGradient>
    <linearGradient id="hdrPlum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b2455"/>
      <stop offset="100%" stop-color="#2b0b2d"/>
    </linearGradient>
    <radialGradient id="hdrLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd48a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd48a" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hdrMerlon" width="12" height="10" patternUnits="userSpaceOnUse" x="562">
      <rect width="7" height="10" fill="#12303f"/>
    </pattern>
    <pattern id="hdrLiegeMerlon" width="6" height="4" patternUnits="userSpaceOnUse" x="166">
      <rect width="3.5" height="4" fill="#24142e"/>
    </pattern>

    <linearGradient id="hdrFadeGrad" x1="0" y1="228" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <mask id="hdrFade" maskUnits="userSpaceOnUse" x="0" y="228" width="1200" height="92">
      <rect x="0" y="228" width="1200" height="92" fill="url(#hdrFadeGrad)"/>
    </mask>
    <filter id="hdrRipple" filterUnits="userSpaceOnUse" x="0" y="224" width="1200" height="96">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.2" numOctaves="1" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <linearGradient id="hdrVig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#02050b" stop-opacity="0.5"/>
      <stop offset="22%"  stop-color="#02050b" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#02050b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02050b" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="hdrVigSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#02050b" stop-opacity="0.45"/>
      <stop offset="15%"  stop-color="#02050b" stop-opacity="0"/>
      <stop offset="85%"  stop-color="#02050b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02050b" stop-opacity="0.45"/>
    </linearGradient>
    <!-- rounded top corners: this banner caps the page -->
    <clipPath id="hdrClip">
      <path d="M 0 320 L 0 18 Q 0 0 18 0 L 1182 0 Q 1200 0 1200 18 L 1200 320 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#hdrClip)">

  <!-- ============ SKY AND WATER ============ -->
  <rect width="1200" height="228" fill="url(#hdrSky)"/>
  <rect y="228" width="1200" height="92" fill="url(#hdrWater)"/>
  <g fill="#eaf6ff">
    <circle cx="40"  cy="30"  r="1.2" opacity="0.6"/><circle cx="96"  cy="84"  r="0.9" opacity="0.4"/>
    <circle cx="150" cy="22"  r="1"   opacity="0.5"/><circle cx="330" cy="46"  r="1.3" opacity="0.6"/>
    <circle cx="380" cy="110" r="0.9" opacity="0.4"/><circle cx="430" cy="24"  r="1"   opacity="0.5"/>
    <circle cx="470" cy="76"  r="0.8" opacity="0.35"/><circle cx="520" cy="40" r="1.1" opacity="0.55"/>
    <circle cx="690" cy="30"  r="1.1" opacity="0.55"/><circle cx="740" cy="96" r="0.9" opacity="0.4"/>
    <circle cx="790" cy="20"  r="1"   opacity="0.5"/><circle cx="840" cy="130" r="0.8" opacity="0.35"/>
    <circle cx="1080" cy="40" r="1.2" opacity="0.55"/><circle cx="1130" cy="110" r="0.9" opacity="0.4"/>
    <circle cx="1160" cy="24" r="1"   opacity="0.5"/><circle cx="270" cy="140" r="0.8" opacity="0.3"/>
    <circle cx="1010" cy="150" r="0.8" opacity="0.3"/><circle cx="20" cy="150" r="0.8" opacity="0.3"/>
  </g>

  <g id="hdrWorld">
    <!-- the moon, behind everything -->
    <circle cx="946" cy="74" r="120" fill="url(#hdrMoonGlow)"/>
    <circle cx="946" cy="74" r="26" fill="url(#hdrMoon)"/>
    <circle cx="938" cy="68" r="4" fill="#c9d9df" opacity="0.5"/>
    <circle cx="954" cy="84" r="3" fill="#c9d9df" opacity="0.4"/>

    <!-- ============ THE FAR SHORE, AND THE PARENT COUNCIL'S FORTRESS ============ -->
    <ellipse cx="236" cy="190" rx="190" ry="90" fill="url(#hdrLiegeGlow)"/>
    <path d="M 0 228 L 0 206 Q 70 192 140 198 Q 210 184 290 196 Q 360 206 430 216 L 760 220 Q 840 208 920 204 Q 1010 192 1090 202 Q 1150 208 1200 202 L 1200 228 Z"
          fill="#0a1a28"/>

    <!-- drawn on a y=202 base, then shrunk with distance -->
    <g transform="translate(236,204) scale(0.8) translate(-236,-202)">
    <g fill="#24142e">
      <!-- curtain wall, wing towers and the great keep -->
      <rect x="168" y="182" width="136" height="20"/>
      <rect x="168" y="178" width="136" height="4" fill="url(#hdrLiegeMerlon)"/>
      <rect x="172" y="156" width="20" height="46"/><rect x="280" y="156" width="20" height="46"/>
      <rect x="170" y="151" width="24" height="5" fill="url(#hdrLiegeMerlon)"/>
      <rect x="278" y="151" width="24" height="5" fill="url(#hdrLiegeMerlon)"/>
      <rect x="214" y="132" width="44" height="70"/>
      <rect x="211" y="126" width="50" height="6" fill="url(#hdrLiegeMerlon)"/>
      <path d="M 226 126 L 236 110 L 246 126 Z"/>
      <rect x="235.2" y="94" width="1.6" height="16"/>
      <rect x="181.4" y="138" width="1.2" height="13"/><rect x="289.4" y="138" width="1.2" height="13"/>
    </g>
    <!-- its plum standards, still flying -->
    <g fill="url(#hdrPlum)" stroke="#c9962f" stroke-width="0.7" stroke-linejoin="round">
      <path d="M 236.8 95 L 252 99 L 236.8 103 Z"/>
      <path d="M 182.6 139 L 172 142 L 182.6 145 Z"/>
      <path d="M 290.6 139 L 301 142 L 290.6 145 Z"/>
    </g>
    <g fill="#ffcf8a">
      <rect x="233" y="140" width="5" height="8" rx="2.5" fill="#fff0c8"/><rect x="222" y="158" width="4" height="7" rx="2"/>
      <rect x="246" y="158" width="4" height="7" rx="2"/><rect x="233" y="174" width="5" height="8" rx="2.5"/>
      <rect x="179" y="166" width="4" height="7" rx="2"/><rect x="287" y="166" width="4" height="7" rx="2" fill="#fff0c8"/>
      <rect x="200" y="188" width="3" height="5" rx="1.5"/><rect x="268" y="188" width="3" height="5" rx="1.5"/>
    </g>
    </g>

    <!-- ============ THE ISLET ============ -->
    <path d="M 440 228 Q 470 210 520 210 L 680 210 Q 730 210 760 228 Z" fill="#06141c"/>
    <path d="M 470 220 Q 500 212 540 212 M 660 212 Q 700 212 730 220" fill="none" stroke="#cbd5e1" stroke-opacity="0.15" stroke-width="1"/>

    <!-- ============ THE SUB-COUNCIL'S TOWER ============ -->
    <!-- side halls, each ending in a slender turret -->
    <path d="M 484 212 L 484 168 L 566 168 L 566 212 Z" fill="url(#hdrStoneDark)"/>
    <path d="M 634 212 L 634 168 L 716 168 L 716 212 Z" fill="url(#hdrStoneDark)"/>
    <path d="M 478 169 L 524 146 L 570 169 Z" fill="url(#hdrRoof)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1"/>
    <path d="M 630 169 L 676 146 L 722 169 Z" fill="url(#hdrRoof)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="466" y="148" width="18" height="64" fill="url(#hdrStone)"/>
    <rect x="716" y="148" width="18" height="64" fill="url(#hdrStone)"/>
    <path d="M 462 149 L 475 118 L 488 149 Z" fill="url(#hdrRoof)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1"/>
    <path d="M 712 149 L 725 118 L 738 149 Z" fill="url(#hdrRoof)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1"/>
    <g fill="#cbd5e1">
      <rect x="474.4" y="106" width="1.2" height="12"/><rect x="724.4" y="106" width="1.2" height="12"/>
    </g>
    <g fill="url(#hdrTide)" stroke="#cbd5e1" stroke-width="0.7" stroke-linejoin="round">
      <path d="M 475.6 107 L 490 110 L 475.6 113 Z"/>
      <path d="M 725.6 107 L 740 110 L 725.6 113 Z"/>
    </g>

    <!-- the tower itself -->
    <path d="M 566 212 L 571 92 L 629 92 L 634 212 Z" fill="url(#hdrStone)" stroke="#cbd5e1" stroke-opacity="0.22" stroke-width="1.2"/>
    <g stroke="#030a10" stroke-opacity="0.5" stroke-width="1">
      <path d="M 570.5 104 L 629.5 104"/><path d="M 569.8 120 L 630.2 120"/><path d="M 569 140 L 631 140"/>
      <path d="M 567.7 172 L 632.3 172"/><path d="M 567 190 L 633 190"/>
    </g>
    <!-- gallery on its brackets, battlements, and the spire -->
    <g fill="#0b2230">
      <path d="M 566 92 L 574 92 L 572 98 L 568 98 Z"/><path d="M 580 92 L 588 92 L 586 98 L 582 98 Z"/>
      <path d="M 594 92 L 602 92 L 600 98 L 596 98 Z"/><path d="M 608 92 L 616 92 L 614 98 L 610 98 Z"/>
      <path d="M 622 92 L 630 92 L 628 98 L 624 98 Z"/>
    </g>
    <rect x="560" y="80" width="80" height="12" fill="url(#hdrStone)" stroke="#cbd5e1" stroke-opacity="0.25" stroke-width="1"/>
    <rect x="560" y="70" width="80" height="10" fill="url(#hdrMerlon)"/>
    <path d="M 566 72 L 600 18 L 634 72 Z" fill="url(#hdrRoof)" stroke="#cbd5e1" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="599.2" y="2" width="1.6" height="16" fill="#cbd5e1"/>
    <circle cx="600" cy="3" r="2.4" fill="#f0c46a"/>
    <path d="M 600.8 5 L 632 10 L 620 12 L 632 14.5 L 600.8 16 Z" fill="url(#hdrTide)" stroke="#e2e8f0" stroke-width="0.9" stroke-linejoin="round"/>

    <!-- windows: warm light behind cold stone -->
    <g fill="#ffcf8a">
      <rect x="585" y="107" width="6" height="11" rx="3"/><rect x="609" y="107" width="6" height="11" rx="3" fill="#fff0c8"/>
      <rect x="597" y="124" width="6" height="12" rx="3"/>
      <rect x="498" y="182" width="6" height="11" rx="3"/><rect x="521" y="182" width="6" height="11" rx="3" fill="#fff0c8"/>
      <rect x="544" y="182" width="6" height="11" rx="3"/>
      <rect x="650" y="182" width="6" height="11" rx="3"/><rect x="673" y="182" width="6" height="11" rx="3"/>
      <rect x="696" y="182" width="6" height="11" rx="3" fill="#fff0c8"/>
      <rect x="472" y="164" width="6" height="10" rx="3"/><rect x="722" y="164" width="6" height="10" rx="3"/>
    </g>

    <!-- the tower's standard, bearing the cadet crest -->
    <rect x="574" y="143" width="52" height="3.5" rx="1.5" fill="#cbd5e1"/>
    <circle cx="574" cy="144.7" r="2.2" fill="#f0c46a"/><circle cx="626" cy="144.7" r="2.2" fill="#f0c46a"/>
    <path d="M 579 146.5 L 621 146.5 L 621 204 L 600 192 L 579 204 Z"
          fill="url(#hdrTide)" stroke="#cbd5e1" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 600 154 L 613 158.5 L 613 172 Q 613 181 600 187 Q 587 181 587 172 L 587 158.5 Z"
          fill="#061820" stroke="#e2e8f0" stroke-opacity="0.9" stroke-width="1.2"/>
    <path d="M 593 166 L 607 182 M 607 166 L 593 182" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 590.5 161 L 609.5 161 M 594 161 L 594 164.5 M 600 161 L 600 164.5 M 606 161 L 606 164.5"
          stroke="#f0c46a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- the door, and lanterns at the landing -->
    <path d="M 592 212 L 592 204 A 8 8 0 0 1 608 204 L 608 212 Z" fill="#ffcf8a"/>
    <circle cx="520" cy="204" r="16" fill="url(#hdrLamp)"/><circle cx="680" cy="204" r="16" fill="url(#hdrLamp)"/>
    <g fill="#061017">
      <rect x="519" y="204" width="2" height="10"/><rect x="679" y="204" width="2" height="10"/>
    </g>
    <g fill="#ffe2a8">
      <rect x="517.5" y="199" width="5" height="6" rx="1"/><rect x="677.5" y="199" width="5" height="6" rx="1"/>
    </g>
  </g>

  <!-- ============ THE MIRROR: the lake gives it all back, upside down ============ -->
  <g mask="url(#hdrFade)">
    <g filter="url(#hdrRipple)">
      <use href="#hdrWorld" transform="matrix(1 0 0 -1 0 456)"/>
    </g>
  </g>

  <!-- moon glitter, and lamp light on the water -->
  <g stroke="#e3eef2" stroke-linecap="round">
    <path d="M 930 234 L 962 234 M 936 241 L 956 241 M 924 249 L 968 249 M 938 258 L 954 258 M 928 268 L 964 268 M 940 279 L 952 279 M 932 292 L 960 292 M 942 306 L 950 306"
          stroke-opacity="0.42" stroke-width="1.4"/>
  </g>
  <g stroke="#ffd48a" stroke-linecap="round" stroke-opacity="0.45" stroke-width="1.4">
    <path d="M 516 236 L 524 236 M 514 244 L 526 244 M 517 254 L 523 254"/>
    <path d="M 676 236 L 684 236 M 674 244 L 686 244 M 677 254 L 683 254"/>
    <path d="M 596 238 L 604 238 M 594 248 L 606 248 M 597 260 L 603 260"/>
  </g>
  <g stroke="#cbd5e1" stroke-linecap="round" stroke-width="1">
    <path d="M 40 240 L 140 240 M 300 236 L 400 236 M 780 238 L 860 238 M 1040 242 L 1150 242" stroke-opacity="0.15"/>
    <path d="M 120 264 L 240 264 M 380 272 L 470 272 M 730 266 L 840 266 M 1010 276 L 1120 276" stroke-opacity="0.1"/>
    <path d="M 20 300 L 160 300 M 300 306 L 420 306 M 760 302 L 880 302 M 1060 308 L 1180 308" stroke-opacity="0.07"/>
  </g>
  <line x1="0" y1="228" x2="1200" y2="228" stroke="#cbd5e1" stroke-opacity="0.16" stroke-width="0.8"/>

  <rect width="1200" height="320" fill="url(#hdrVig)"/>
  <rect width="1200" height="320" fill="url(#hdrVigSide)"/>
  </g>
</svg>
