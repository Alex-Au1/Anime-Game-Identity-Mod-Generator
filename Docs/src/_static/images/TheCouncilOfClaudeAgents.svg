<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" aria-label="Seal and banner of The Sub-Council of CLAUDE Agents">
  <!-- The Sub-Council's seal: its cadet crest standing on an islet in a still
       lake by moonlight, mirrored in the water below. Far off on the left shore,
       the parent Council's fortress still burns plum and gold: the Sub-Council
       is a branch of AGRemap's Council of CLAUDE Agents, not a rival to it.
       The horizon is y=200; everything in #bnWorld is reflected about it. -->
  <defs>
    <linearGradient id="bnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050b16"/>
      <stop offset="45%"  stop-color="#0b1e30"/>
      <stop offset="100%" stop-color="#15434f"/>
    </linearGradient>
    <linearGradient id="bnWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f3442"/>
      <stop offset="100%" stop-color="#040f16"/>
    </linearGradient>

    <radialGradient id="bnMoonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#bfe6ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfe6ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bnMoon" cx="40%" cy="35%" r="70%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="70%"  stop-color="#e3eef2"/>
      <stop offset="100%" stop-color="#b6cbd3"/>
    </radialGradient>
    <!-- The parent's fire, seen from far across the water -->
    <radialGradient id="bnLiegeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffb968" stop-opacity="0.4"/>
      <stop offset="45%"  stop-color="#d0641f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d0641f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bnSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3f4f5e"/>
      <stop offset="35%"  stop-color="#e2e8f0"/>
      <stop offset="65%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#3f4f5e"/>
    </linearGradient>
    <linearGradient id="bnRod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="50%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bnTide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#13525c"/>
      <stop offset="55%"  stop-color="#0d3a45"/>
      <stop offset="100%" stop-color="#072029"/>
    </linearGradient>
    <linearGradient id="bnCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#04121a"/>
      <stop offset="50%"  stop-color="#0a2530"/>
      <stop offset="100%" stop-color="#04121a"/>
    </linearGradient>
    <!-- One colour per Sub-Council member, kept as the inlay and the halo -->
    <linearGradient id="bnMembers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#eab308"/>
      <stop offset="33%"  stop-color="#0d9488"/>
      <stop offset="67%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="bnGem" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="bnGold" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#fff6d0"/>
      <stop offset="50%"  stop-color="#f0c46a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
    <linearGradient id="bnPlum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b2455"/>
      <stop offset="100%" stop-color="#2b0b2d"/>
    </linearGradient>

    <linearGradient id="bnFadeGrad" x1="0" y1="200" x2="0" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="bnFade" maskUnits="userSpaceOnUse" x="0" y="200" width="680" height="92">
      <rect x="0" y="200" width="680" height="92" fill="url(#bnFadeGrad)"/>
    </mask>
    <filter id="bnRipple" filterUnits="userSpaceOnUse" x="0" y="196" width="680" height="96">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.22" numOctaves="1" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <radialGradient id="bnVignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <clipPath id="bnClip">
      <rect x="2" y="2" width="676" height="288" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bnClip)">
  <!-- ============ SKY AND WATER ============ -->
  <rect width="680" height="200" fill="url(#bnSky)"/>
  <rect y="200" width="680" height="92" fill="url(#bnWater)"/>
  <g fill="#eaf6ff">
    <circle cx="40" cy="88" r="0.9" opacity="0.5"/><circle cx="74" cy="122" r="0.8" opacity="0.35"/>
    <circle cx="196" cy="96" r="1.1" opacity="0.55"/><circle cx="232" cy="134" r="0.8" opacity="0.35"/>
    <circle cx="452" cy="100" r="1" opacity="0.5"/><circle cx="486" cy="138" r="0.8" opacity="0.35"/>
    <circle cx="620" cy="118" r="1.1" opacity="0.5"/><circle cx="652" cy="90" r="0.8" opacity="0.4"/>
    <circle cx="160" cy="140" r="0.7" opacity="0.3"/><circle cx="530" cy="146" r="0.7" opacity="0.3"/>
  </g>

  <g id="bnWorld">
    <!-- the moon, behind everything -->
    <circle cx="578" cy="104" r="48" fill="url(#bnMoonGlow)"/>
    <circle cx="578" cy="104" r="14" fill="url(#bnMoon)"/>

    <!-- ============ FAR SHORE, AND THE PARENT COUNCIL'S FORTRESS ON IT ============ -->
    <g transform="translate(0,24)">
    <ellipse cx="96" cy="156" rx="90" ry="44" fill="url(#bnLiegeGlow)"/>
    <path d="M 0 176 L 0 160 Q 40 150 80 154 Q 120 146 160 158 Q 200 166 240 170 L 440 172 Q 500 164 560 166 Q 620 158 680 164 L 680 176 Z"
          fill="#091925"/>
    <g fill="#24142e">
      <rect x="62" y="148" width="68" height="10"/>
      <rect x="64" y="136" width="9" height="22"/><rect x="119" y="136" width="9" height="22"/>
      <rect x="86" y="126" width="20" height="32"/>
      <path d="M 84 126 L 96 116 L 108 126 Z"/>
      <path d="M 63 136 L 63 133 L 65 133 L 65 135 L 67 135 L 67 133 L 69 133 L 69 135 L 71 135 L 71 133 L 74 133 L 74 136 Z"/>
      <path d="M 118 136 L 118 133 L 120 133 L 120 135 L 122 135 L 122 133 L 124 133 L 124 135 L 126 135 L 126 133 L 129 133 L 129 136 Z"/>
      <rect x="95.4" y="106" width="1.2" height="10"/>
    </g>
    <path d="M 96.6 107 L 106 109.5 L 96.6 112 Z" fill="url(#bnPlum)" stroke="#c9962f" stroke-width="0.5"/>
    <g fill="#ffcf8a">
      <rect x="94.5" y="132" width="3" height="5" rx="1.5"/><rect x="94.5" y="142" width="3" height="5" rx="1.5"/>
      <rect x="67" y="142" width="2.5" height="4" rx="1.2"/><rect x="122.5" y="142" width="2.5" height="4" rx="1.2"/>
    </g>

    </g>

    <!-- The centrepiece is drawn on a y=176 base, then set on the horizon and enlarged -->
    <g transform="translate(340,200) scale(1.2) translate(-340,-176)">
    <!-- ============ THE ISLET THE CREST STANDS ON ============ -->
    <path d="M 214 176 Q 232 162 268 160 L 412 160 Q 448 162 466 176 Z" fill="#06141c"/>
    <path d="M 236 168 Q 260 162 290 163 M 392 163 Q 420 162 444 168" fill="none" stroke="#cbd5e1" stroke-opacity="0.18" stroke-width="1"/>

    <!-- ============ STANDARD-POLES AND THEIR SWALLOWTAILS ============ -->
    <g stroke="#0b1520" stroke-width="4.4" stroke-linecap="round">
      <line x1="244" y1="166" x2="244" y2="74"/><line x1="436" y1="166" x2="436" y2="74"/>
    </g>
    <g stroke="url(#bnRod)" stroke-width="2.8" stroke-linecap="round">
      <line x1="244" y1="166" x2="244" y2="74"/><line x1="436" y1="166" x2="436" y2="74"/>
    </g>
    <circle cx="244" cy="71" r="4" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.8"/>
    <circle cx="436" cy="71" r="4" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.8"/>

    <g stroke="url(#bnSilver)" stroke-width="1.6" stroke-linejoin="round">
      <path d="M 246 80 L 290 84 L 290 146 L 276 136 L 268 152 L 246 146 Z" fill="url(#bnTide)"/>
      <path d="M 434 80 L 390 84 L 390 146 L 404 136 L 412 152 L 434 146 Z" fill="url(#bnTide)"/>
    </g>
    <path d="M 256 88 C 254 110 254 128 252 144 M 424 88 C 426 110 426 128 428 144" fill="none" stroke="#020a10" stroke-opacity="0.35" stroke-width="1"/>
    <!-- each swallowtail bears the gold label alone: the mark of the cadet line -->
    <g stroke="#f0c46a" stroke-width="2" stroke-linecap="round">
      <path d="M 257 100 L 281 100 M 261 100 L 261 106 M 269 100 L 269 106 M 277 100 L 277 106"/>
      <path d="M 399 100 L 423 100 M 403 100 L 403 106 M 411 100 L 411 106 M 419 100 L 419 106"/>
    </g>
    <rect width="6" height="6" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.6"
          transform="translate(268,122) rotate(45) translate(-3,-3)"/>
    <rect width="6" height="6" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.6"
          transform="translate(412,122) rotate(45) translate(-3,-3)"/>

    <!-- ============ THE GRAND CREST ============ -->
    <circle cx="340" cy="124" r="42" fill="none" stroke="url(#bnMembers)" stroke-width="2.5" opacity="0.6"/>
    <circle cx="340" cy="124" r="36" fill="none" stroke="#cbd5e1" stroke-width="0.8" opacity="0.3"/>

    <!-- silver circlet with the liege's single gold stone -->
    <path d="M 324 80 L 327 71 L 333 77 L 340 66 L 347 77 L 353 71 L 356 80 Z"
          fill="url(#bnGem)" stroke="#334155" stroke-width="1"/>
    <line x1="322" y1="80.5" x2="358" y2="80.5" stroke="#334155" stroke-width="1.6"/>
    <circle cx="340" cy="75" r="2.4" fill="url(#bnGold)" stroke="#6b4423" stroke-width="0.5"/>

    <path d="M 340 84 L 374 95 L 374 128 Q 374 152 340 168 Q 306 152 306 128 L 306 95 Z"
          fill="url(#bnCap)" stroke="url(#bnSilver)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 340 90 L 368 99.5 L 368 128 Q 368 148 340 161.5 Q 312 148 312 128 L 312 99.5 Z"
          fill="none" stroke="#cbd5e1" stroke-opacity="0.35" stroke-width="1"/>

    <!-- the parent's crossed sword and dagger, in silver -->
    <g stroke-linecap="round">
      <path d="M 322 114 L 357 153 M 358 114 L 323 153" stroke="#020a10" stroke-width="5.4"/>
      <path d="M 322 114 L 357 153 M 358 114 L 323 153" stroke="#e2e8f0" stroke-width="3.2"/>
      <path d="M 324 125 L 333 117 M 356 125 L 347 117" stroke="#cbd5e1" stroke-width="2.2"/>
    </g>
    <circle cx="322" cy="114" r="2.2" fill="url(#bnGem)"/>
    <circle cx="358" cy="114" r="2.2" fill="url(#bnGem)"/>
    <circle cx="340" cy="133.5" r="3" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.6"/>

    <!-- the label of three points, in the liege's gold, across the chief -->
    <g stroke="#3d2b06" stroke-width="5" stroke-linecap="round">
      <path d="M 318 100 L 362 100 M 326 100 L 326 108 M 340 100 L 340 108 M 354 100 L 354 108"/>
    </g>
    <g stroke="#f0c46a" stroke-width="3" stroke-linecap="round">
      <path d="M 318 100 L 362 100 M 326 100 L 326 108 M 340 100 L 340 108 M 354 100 L 354 108"/>
    </g>
    </g>
  </g>

  <!-- ============ THE MIRROR: the whole shore, reflected ============ -->
  <g mask="url(#bnFade)">
    <g filter="url(#bnRipple)">
      <use href="#bnWorld" transform="matrix(1 0 0 -1 0 400)"/>
    </g>
  </g>

  <!-- moon glitter and ripples on the water -->
  <g stroke="#e3eef2" stroke-linecap="round">
    <path d="M 566 206 L 590 206 M 570 212 L 586 212 M 560 219 L 596 219 M 572 227 L 584 227 M 564 236 L 592 236 M 574 246 L 582 246 M 568 258 L 588 258"
          stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M 40 214 L 110 214 M 150 222 L 214 222 M 470 218 L 530 218 M 610 220 L 664 220" stroke-opacity="0.16" stroke-width="1"/>
    <path d="M 80 244 L 170 244 M 230 262 L 300 262 M 400 256 L 470 256 M 520 272 L 620 272" stroke-opacity="0.11" stroke-width="1"/>
    <path d="M 30 280 L 120 280 M 200 284 L 300 284 M 420 282 L 500 282" stroke-opacity="0.08" stroke-width="1"/>
  </g>
  <line x1="0" y1="200" x2="680" y2="200" stroke="#cbd5e1" stroke-opacity="0.18" stroke-width="0.8"/>

  <!-- ============ THE NAME PLAQUE, CROWNING THE SCENE ============ -->
  <g>
    <path d="M 82 14 L 598 14 L 618 38 L 598 62 L 82 62 L 62 38 Z" fill="#000000" opacity="0.35" transform="translate(0,3)"/>
    <path d="M 82 14 L 598 14 L 618 38 L 598 62 L 82 62 L 62 38 Z"
          fill="url(#bnTide)" stroke="url(#bnSilver)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 86 20 L 594 20 L 610 38 L 594 56 L 86 56 L 70 38 Z"
          fill="none" stroke="url(#bnMembers)" stroke-width="1" opacity="0.5"/>
    <!-- braided silver cord along the top and bottom edges -->
    <line x1="92" y1="14" x2="588" y2="14" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="92" y1="14" x2="588" y2="14" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" stroke-dashoffset="4"/>
    <line x1="92" y1="62" x2="588" y2="62" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="92" y1="62" x2="588" y2="62" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" stroke-dashoffset="4"/>
    <circle cx="70" cy="38" r="3" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.7"/>
    <circle cx="610" cy="38" r="3" fill="url(#bnGem)" stroke="#1e293b" stroke-width="0.7"/>

    <!-- small cadet crests flanking the name, drawn rather than emoji -->
    <g>
      <path d="M 118 26 L 128 29.5 L 128 40 Q 128 46 118 50 Q 108 46 108 40 L 108 29.5 Z" fill="url(#bnCap)" stroke="url(#bnSilver)" stroke-width="1.3"/>
      <path d="M 113 36 L 123 47 M 123 36 L 113 47" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 111.5 31.5 L 124.5 31.5 M 114 31.5 L 114 34.5 M 118 31.5 L 118 34.5 M 122 31.5 L 122 34.5" stroke="#f0c46a" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 562 26 L 572 29.5 L 572 40 Q 572 46 562 50 Q 552 46 552 40 L 552 29.5 Z" fill="url(#bnCap)" stroke="url(#bnSilver)" stroke-width="1.3"/>
      <path d="M 557 36 L 567 47 M 567 36 L 557 47" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 555.5 31.5 L 568.5 31.5 M 558 31.5 L 558 34.5 M 562 31.5 L 562 34.5 M 566 31.5 L 566 34.5" stroke="#f0c46a" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <!-- hanging seal medallion, top centre: the parent's gold, crossed blades -->
    <circle cx="340" cy="14" r="8" fill="url(#bnGold)" stroke="#6b4423" stroke-width="1.1"/>
    <path d="M 336.5 10.5 L 343.5 17.5 M 343.5 10.5 L 336.5 17.5" stroke="#6b4423" stroke-width="1.1" stroke-linecap="round"/>

    <text x="340" y="44.5" text-anchor="middle" fill="#e6f4f1"
          font-family="Cinzel, Georgia, 'Times New Roman', serif"
          font-size="18" font-weight="700" letter-spacing="0.5" style="font-variant: small-caps">The Sub-Council of CLAUDE Agents</text>
  </g>

  <rect width="680" height="292" fill="url(#bnVignette)"/>
  </g>

  <!-- frame -->
  <rect x="2" y="2" width="676" height="288" rx="10" fill="none" stroke="url(#bnSilver)" stroke-width="2"/>
  <rect x="6" y="6" width="668" height="280" rx="8" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
</svg>
