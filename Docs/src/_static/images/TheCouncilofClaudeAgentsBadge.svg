<svg xmlns="http://www.w3.org/2000/svg" width="342" height="57" viewBox="0 0 456 76" role="img" aria-label="The Sub-Council of CLAUDE Agents">
  <!-- The Sub-Council: a cadet branch of AGRemap's Council of CLAUDE Agents.
       Where the parent's plaque flies seven plum pennants, this one floats on
       still water and shows its own reflection: an identity mod is a model's
       own reflection, written back out as a mod. -->
  <defs>
    <!-- Deepwater teal for the plaque, darker still for the crest cap -->
    <linearGradient id="sbTide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#13525c"/>
      <stop offset="50%"  stop-color="#0d3a45"/>
      <stop offset="100%" stop-color="#072029"/>
    </linearGradient>
    <linearGradient id="sbCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#04121a"/>
      <stop offset="50%"  stop-color="#0a2530"/>
      <stop offset="100%" stop-color="#04121a"/>
    </linearGradient>

    <!-- Polished silver banding, where the parent has bronze -->
    <linearGradient id="sbSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3f4f5e"/>
      <stop offset="35%"  stop-color="#e2e8f0"/>
      <stop offset="65%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#3f4f5e"/>
    </linearGradient>

    <!-- One colour per Sub-Council member, kept as the inner inlay -->
    <linearGradient id="sbMembers" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#eab308"/>
      <stop offset="33%"  stop-color="#0d9488"/>
      <stop offset="67%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <radialGradient id="sbGem" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </radialGradient>
    <radialGradient id="sbGold" cx="35%" cy="30%" r="75%">
      <stop offset="0%"   stop-color="#fff6d0"/>
      <stop offset="50%"  stop-color="#f0c46a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>

    <!-- The reflection fades out with depth and wavers on the ripples -->
    <linearGradient id="sbFadeGrad" x1="0" y1="46" x2="0" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sbFade" maskUnits="userSpaceOnUse" x="0" y="46" width="456" height="30">
      <rect x="0" y="46" width="456" height="30" fill="url(#sbFadeGrad)"/>
    </mask>
    <filter id="sbRipple" filterUnits="userSpaceOnUse" x="0" y="44" width="456" height="34">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.4" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g id="sbPlaque">
    <!-- Plaque with pointed ends -->
    <path d="M 14 2 L 442 2 L 454 23 L 442 44 L 14 44 L 2 23 Z" fill="url(#sbTide)"/>

    <!-- Darker crest cap on the left -->
    <path d="M 14 2 L 56 2 L 56 44 L 14 44 L 2 23 Z" fill="url(#sbCap)"/>
    <line x1="56" y1="3" x2="56" y2="43" stroke="url(#sbSilver)" stroke-width="1.5"/>

    <!-- Member-coloured inlay, echoing the plaque edge -->
    <path d="M 17 7 L 439 7 L 448 23 L 439 39 L 17 39 L 8 23 Z"
          fill="none" stroke="url(#sbMembers)" stroke-width="1" opacity="0.55"/>

    <!-- Outer silver frame -->
    <path d="M 14 2 L 442 2 L 454 23 L 442 44 L 14 44 L 2 23 Z"
          fill="none" stroke="url(#sbSilver)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Cadet crest: the parent's crossed sword and dagger, differenced with a gold label -->
    <path d="M 31 8 L 43 12 L 43 26 Q 43 33.5 31 39 Q 19 33.5 19 26 L 19 12 Z"
          fill="url(#sbCap)" stroke="url(#sbSilver)" stroke-width="1.3"/>
    <path d="M 24.5 19.5 L 37.5 35 M 37.5 19.5 L 24.5 35" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="31" cy="27.3" r="1.6" fill="url(#sbGem)"/>
    <path d="M 22.5 14.5 L 39.5 14.5 M 25.5 14.5 L 25.5 18.3 M 31 14.5 L 31 18.3 M 36.5 14.5 L 36.5 18.3"
          stroke="#f0c46a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Flanking jewels: silver, with the liege's gold at the heart -->
    <rect width="5.5" height="5.5" fill="url(#sbGem)" stroke="#1e293b" stroke-width="0.6"
          transform="translate(72,23) rotate(45) translate(-2.75,-2.75)"/>
    <rect width="5.5" height="5.5" fill="url(#sbGem)" stroke="#1e293b" stroke-width="0.6"
          transform="translate(430,23) rotate(45) translate(-2.75,-2.75)"/>
    <circle cx="72" cy="23" r="1" fill="url(#sbGold)"/>
    <circle cx="430" cy="23" r="1" fill="url(#sbGold)"/>

    <!-- Tip rivets -->
    <circle cx="9" cy="23" r="1.8" fill="url(#sbGem)" stroke="#1e293b" stroke-width="0.5"/>
    <circle cx="447" cy="23" r="1.8" fill="url(#sbGem)" stroke="#1e293b" stroke-width="0.5"/>

    <text x="251" y="28.5" text-anchor="middle" fill="#e6f4f1"
          font-family="Cinzel, Georgia, 'Times New Roman', serif"
          font-size="16" font-weight="700" letter-spacing="0.5" style="font-variant: small-caps">The Sub-Council of CLAUDE Agents</text>
  </g>

  <!-- ============ THE MIRROR: the plaque's reflection on still water ============ -->
  <g mask="url(#sbFade)">
    <g filter="url(#sbRipple)">
      <use href="#sbPlaque" transform="matrix(1 0 0 -1 0 92)"/>
    </g>
  </g>

  <!-- the water's surface, and a few silver ripples -->
  <line x1="18" y1="46.5" x2="438" y2="46.5" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="0.8"/>
  <g stroke="#cbd5e1" stroke-linecap="round">
    <path d="M 96 54 L 150 54 M 214 53 L 296 53 M 340 54 L 390 54" stroke-opacity="0.32" stroke-width="0.9"/>
    <path d="M 60 61 L 98 61 M 176 62 L 236 62 M 280 61 L 330 61 M 384 62 L 420 62" stroke-opacity="0.22" stroke-width="0.8"/>
    <path d="M 132 69 L 168 69 M 236 70 L 274 70 M 340 69 L 376 69" stroke-opacity="0.14" stroke-width="0.7"/>
  </g>
</svg>
