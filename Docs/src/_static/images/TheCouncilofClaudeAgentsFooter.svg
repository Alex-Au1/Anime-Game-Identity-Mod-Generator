<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="The causeway across the lake to the door of the Mirror Tower of The Sub-Council of CLAUDE Agents">
  <!-- The way in. Close under the header's tower: its wall fills the top of the
       frame and stands in the lake at y=130, and a stone causeway runs out of
       the lit door towards us, lanterns down both edges, all of it mirrored in
       the water on either side. Everything in #ftrWorld is reflected about y=130. -->
  <defs>
    <linearGradient id="ftrWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1d29"/>
      <stop offset="60%"  stop-color="#132f3e"/>
      <stop offset="100%" stop-color="#0d2431"/>
    </linearGradient>
    <!-- moonlight raking in from the right -->
    <linearGradient id="ftrMoonlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#bfe6ee" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#bfe6ee" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#bfe6ee" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ftrWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f3442"/>
      <stop offset="100%" stop-color="#040f16"/>
    </linearGradient>

    <!-- the lit hall beyond: this is the way in -->
    <linearGradient id="ftrGateway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a1a12"/>
      <stop offset="34%"  stop-color="#8f4a15"/>
      <stop offset="70%"  stop-color="#eda94f"/>
      <stop offset="100%" stop-color="#ffe9bd"/>
    </linearGradient>
    <radialGradient id="ftrDoorGlow" cx="600" cy="120" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffb968" stop-opacity="0.32"/>
      <stop offset="45%"  stop-color="#d0641f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#d0641f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ftrPool" cx="600" cy="132" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffc879" stop-opacity="0.5"/>
      <stop offset="55%"  stop-color="#e08a34" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e08a34" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ftrLamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd48a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd48a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ftrCauseway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#173040"/>
      <stop offset="100%" stop-color="#2a4858"/>
    </linearGradient>
    <linearGradient id="ftrTide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#13525c"/>
      <stop offset="100%" stop-color="#072029"/>
    </linearGradient>
    <linearGradient id="ftrSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3f4f5e"/>
      <stop offset="35%"  stop-color="#e2e8f0"/>
      <stop offset="65%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#3f4f5e"/>
    </linearGradient>

    <linearGradient id="ftrFadeGrad" x1="0" y1="130" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <mask id="ftrFade" maskUnits="userSpaceOnUse" x="0" y="130" width="1200" height="150">
      <rect x="0" y="130" width="1200" height="150" fill="url(#ftrFadeGrad)"/>
    </mask>
    <filter id="ftrRipple" filterUnits="userSpaceOnUse" x="0" y="126" width="1200" height="154">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.16" numOctaves="1" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <linearGradient id="ftrVig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#02050b" stop-opacity="0.62"/>
      <stop offset="24%"  stop-color="#02050b" stop-opacity="0"/>
      <stop offset="76%"  stop-color="#02050b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#02050b" stop-opacity="0.62"/>
    </linearGradient>
    <!-- rounded bottom corners: this banner closes the page -->
    <clipPath id="ftrClip">
      <path d="M 0 0 L 1200 0 L 1200 262 Q 1200 280 1182 280 L 18 280 Q 0 280 0 262 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ftrClip)">

  <rect y="130" width="1200" height="150" fill="url(#ftrWater)"/>

  <g id="ftrWorld">
    <!-- ============ THE TOWER'S FOOT, FILLING THE FRAME ============ -->
    <rect width="1200" height="130" fill="url(#ftrWall)"/>
    <g stroke="#030a10" stroke-opacity="0.5" stroke-width="1.5">
      <path d="M 0 24 L 1200 24"/><path d="M 0 48 L 1200 48"/><path d="M 0 72 L 1200 72"/>
      <path d="M 0 96 L 1200 96"/><path d="M 0 120 L 1200 120"/>
    </g>
    <g stroke="#030a10" stroke-opacity="0.38" stroke-width="1.2">
      <path d="M 70 0 L 70 24"/><path d="M 230 0 L 230 24"/><path d="M 390 0 L 390 24"/>
      <path d="M 810 0 L 810 24"/><path d="M 970 0 L 970 24"/><path d="M 1130 0 L 1130 24"/>
      <path d="M 150 24 L 150 48"/><path d="M 310 24 L 310 48"/><path d="M 890 24 L 890 48"/><path d="M 1050 24 L 1050 48"/>
      <path d="M 60 48 L 60 72"/><path d="M 220 48 L 220 72"/><path d="M 380 48 L 380 72"/>
      <path d="M 820 48 L 820 72"/><path d="M 980 48 L 980 72"/><path d="M 1140 48 L 1140 72"/>
      <path d="M 140 72 L 140 96"/><path d="M 300 72 L 300 96"/><path d="M 900 72 L 900 96"/><path d="M 1060 72 L 1060 96"/>
      <path d="M 80 96 L 80 120"/><path d="M 240 96 L 240 120"/><path d="M 400 96 L 400 120"/>
      <path d="M 800 96 L 800 120"/><path d="M 960 96 L 960 120"/><path d="M 1120 96 L 1120 120"/>
    </g>
    <rect width="1200" height="130" fill="url(#ftrMoonlight)"/>
    <rect width="1200" height="130" fill="url(#ftrDoorGlow)"/>
    <!-- the plinth the wall stands on, wet at the waterline -->
    <rect y="122" width="1200" height="8" fill="#07141c"/>
    <line x1="0" y1="122.5" x2="1200" y2="122.5" stroke="#cbd5e1" stroke-opacity="0.18" stroke-width="1"/>

    <!-- ============ THE DOOR ============ -->
    <path d="M 550 130 L 550 82 A 50 48 0 0 1 650 82 L 650 130 Z" fill="#1d4152"/>
    <path d="M 559 130 L 559 83 A 41 40 0 0 1 641 83 L 641 130 Z" fill="#081820"/>
    <path d="M 566 130 L 566 85 A 34 33 0 0 1 634 85 L 634 130 Z" fill="url(#ftrGateway)"/>
    <g stroke="#030a10" stroke-opacity="0.55" stroke-width="1.4">
      <path d="M 552 64 L 561 68"/><path d="M 566 46 L 573 54"/><path d="M 586 36 L 589 45"/>
      <path d="M 614 36 L 611 45"/><path d="M 634 46 L 627 54"/><path d="M 648 64 L 639 68"/>
    </g>
    <!-- keystone, silver -->
    <path d="M 594 33 L 606 33 L 604 44 L 596 44 Z" fill="url(#ftrSilver)"/>

    <!-- ============ THE CADET CREST ABOVE THE DOOR ============ -->
    <path d="M 600 3 L 614 7.5 L 614 19 Q 614 26.5 600 31.5 Q 586 26.5 586 19 L 586 7.5 Z"
          fill="#061820" stroke="#e2e8f0" stroke-opacity="0.9" stroke-width="1.3"/>
    <path d="M 592.5 14 L 607.5 28 M 607.5 14 L 592.5 28" stroke="#e2e8f0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 590 9.5 L 610 9.5 M 593.5 9.5 L 593.5 12.8 M 600 9.5 L 600 12.8 M 606.5 9.5 L 606.5 12.8"
          stroke="#f0c46a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- ============ BANNERS FLANKING THE DOOR ============ -->
    <g fill="#cbd5e1">
      <rect x="450" y="24" width="60" height="3.5" rx="1.5"/><rect x="690" y="24" width="60" height="3.5" rx="1.5"/>
    </g>
    <g fill="#f0c46a">
      <circle cx="450" cy="25.7" r="2.4"/><circle cx="510" cy="25.7" r="2.4"/>
      <circle cx="690" cy="25.7" r="2.4"/><circle cx="750" cy="25.7" r="2.4"/>
    </g>
    <g fill="url(#ftrTide)" stroke="#cbd5e1" stroke-width="1.3" stroke-linejoin="round">
      <path d="M 456 27.5 L 504 27.5 L 504 112 L 480 98 L 456 112 Z"/>
      <path d="M 696 27.5 L 744 27.5 L 744 112 L 720 98 L 696 112 Z"/>
    </g>
    <g stroke-linecap="round">
      <path d="M 468 38 L 492 38 M 472 38 L 472 43 M 480 38 L 480 43 M 488 38 L 488 43
               M 708 38 L 732 38 M 712 38 L 712 43 M 720 38 L 720 43 M 728 38 L 728 43"
            stroke="#f0c46a" stroke-width="2"/>
      <path d="M 470 54 L 490 80 M 490 54 L 470 80 M 710 54 L 730 80 M 730 54 L 710 80"
            stroke="#e2e8f0" stroke-width="2.4" stroke-opacity="0.9"/>
    </g>

    <!-- ============ WALL LAMPS ============ -->
    <g>
      <circle cx="320" cy="66" r="26" fill="url(#ftrLamp)"/><circle cx="880" cy="66" r="26" fill="url(#ftrLamp)"/>
      <circle cx="130" cy="78" r="22" fill="url(#ftrLamp)"/><circle cx="1070" cy="78" r="22" fill="url(#ftrLamp)"/>
    </g>
    <g fill="#ffcf8a">
      <rect x="316" y="58" width="8" height="15" rx="4" fill="#fff0c8"/><rect x="876" y="58" width="8" height="15" rx="4"/>
      <rect x="126.5" y="71" width="7" height="13" rx="3.5"/><rect x="1066.5" y="71" width="7" height="13" rx="3.5" fill="#fff0c8"/>
    </g>
  </g>

  <!-- ============ THE MIRROR: the tower's foot, upside down in the lake ============ -->
  <g mask="url(#ftrFade)">
    <g filter="url(#ftrRipple)">
      <use href="#ftrWorld" transform="matrix(1 0 0 -1 0 260)"/>
    </g>
  </g>
  <g stroke="#cbd5e1" stroke-linecap="round" stroke-width="1">
    <path d="M 30 146 L 140 146 M 230 152 L 330 152 M 860 150 L 960 150 M 1050 144 L 1160 144" stroke-opacity="0.16"/>
    <path d="M 80 186 L 200 186 M 250 204 L 330 204 M 870 196 L 980 196 M 1040 210 L 1150 210" stroke-opacity="0.1"/>
    <path d="M 20 246 L 160 246 M 200 266 L 300 266 M 900 250 L 1040 250 M 1080 268 L 1180 268" stroke-opacity="0.07"/>
  </g>
  <g stroke="#ffd48a" stroke-linecap="round" stroke-opacity="0.42" stroke-width="1.5">
    <path d="M 314 160 L 326 160 M 311 170 L 329 170 M 316 182 L 324 182 M 313 194 L 327 194"/>
    <path d="M 874 160 L 886 160 M 871 170 L 889 170 M 876 182 L 884 182 M 873 194 L 887 194"/>
    <path d="M 126 176 L 134 176 M 123 186 L 137 186 M 127 198 L 133 198"/>
    <path d="M 1066 176 L 1074 176 M 1063 186 L 1077 186 M 1067 198 L 1073 198"/>
  </g>

  <!-- ============ THE CAUSEWAY, RUNNING OUT OF THE DOOR TOWARDS US ============ -->
  <path d="M 566 130 L 334 280 L 318 280 L 562 132 Z" fill="#05111a"/>
  <path d="M 634 130 L 866 280 L 882 280 L 638 132 Z" fill="#05111a"/>
  <path d="M 566 130 L 634 130 L 866 280 L 334 280 Z" fill="url(#ftrCauseway)"/>
  <path d="M 566 130 L 634 130 L 866 280 L 334 280 Z" fill="url(#ftrPool)"/>
  <g stroke="#06121a" stroke-opacity="0.6" stroke-width="1.2">
    <path d="M 556.7 136 L 643.3 136"/><path d="M 544.3 144 L 655.7 144"/><path d="M 528.9 154 L 671.1 154"/>
    <path d="M 508.8 167 L 691.2 167"/><path d="M 484 183 L 716 183"/><path d="M 453.1 203 L 746.9 203"/>
    <path d="M 414.4 228 L 785.6 228"/><path d="M 368 258 L 832 258"/>
    <path d="M 600 130 L 600 280"/><path d="M 583 130 L 467 280"/><path d="M 617 130 L 733 280"/>
  </g>
  <path d="M 566 130 L 334 280 M 634 130 L 866 280" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.2"/>

  <!-- lanterns down both edges, larger as they come nearer -->
  <g>
    <circle cx="519.6" cy="146" r="14" fill="url(#ftrLamp)"/><circle cx="680.4" cy="146" r="14" fill="url(#ftrLamp)"/>
    <circle cx="461.6" cy="176" r="22" fill="url(#ftrLamp)"/><circle cx="738.4" cy="176" r="22" fill="url(#ftrLamp)"/>
    <circle cx="380.4" cy="218" r="34" fill="url(#ftrLamp)"/><circle cx="819.6" cy="218" r="34" fill="url(#ftrLamp)"/>
  </g>
  <g fill="#05111a">
    <rect x="518.7" y="146" width="1.8" height="14"/><rect x="679.5" y="146" width="1.8" height="14"/>
    <rect x="460.3" y="174" width="2.6" height="23.5"/><rect x="737.1" y="174" width="2.6" height="23.5"/>
    <rect x="378.4" y="214" width="4" height="36"/><rect x="817.6" y="214" width="4" height="36"/>
  </g>
  <g fill="#ffe2a8" stroke="#05111a" stroke-width="1">
    <rect x="516.6" y="140" width="6" height="7" rx="1"/><rect x="677.4" y="140" width="6" height="7" rx="1"/>
    <rect x="457.1" y="165" width="9" height="10.5" rx="1.5"/><rect x="733.9" y="165" width="9" height="10.5" rx="1.5"/>
    <rect x="373.4" y="199" width="14" height="16" rx="2"/><rect x="812.6" y="199" width="14" height="16" rx="2"/>
  </g>
  <g fill="#05111a">
    <path d="M 515.6 140 L 519.6 136 L 523.6 140 Z"/><path d="M 676.4 140 L 680.4 136 L 684.4 140 Z"/>
    <path d="M 456.1 165 L 461.6 159 L 467.1 165 Z"/><path d="M 732.9 165 L 738.4 159 L 743.9 165 Z"/>
    <path d="M 372.4 199 L 380.4 190 L 388.4 199 Z"/><path d="M 811.6 199 L 819.6 190 L 827.6 199 Z"/>
  </g>

  <rect width="1200" height="280" fill="url(#ftrVig)"/>
  </g>
</svg>
