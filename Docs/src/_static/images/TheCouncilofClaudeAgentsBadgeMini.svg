<svg xmlns="http://www.w3.org/2000/svg" width="136" height="20" viewBox="0 0 272 40" role="img" aria-label="The Sub-Council">
  <!-- Inline badge: sized to sit inside a line of prose, so it carries only the
       crest and the short name. The Sub-Council is a cadet branch of AGRemap's
       Council: same crest (crossed sword and dagger), differenced with a gold
       label of three points, in deepwater teal and silver instead of plum and
       bronze. The pointed ends tell it apart from the parent's chamfered plaque. -->
  <defs>
    <linearGradient id="smnTide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#13525c"/>
      <stop offset="55%"  stop-color="#0d3a45"/>
      <stop offset="100%" stop-color="#072029"/>
    </linearGradient>
    <linearGradient id="smnCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#04121a"/>
      <stop offset="100%" stop-color="#0a2530"/>
    </linearGradient>
    <linearGradient id="smnSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#3f4f5e"/>
      <stop offset="35%"  stop-color="#e2e8f0"/>
      <stop offset="65%"  stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#3f4f5e"/>
    </linearGradient>
  </defs>

  <path d="M 11 1.5 L 261 1.5 L 270.5 20 L 261 38.5 L 11 38.5 L 1.5 20 Z" fill="url(#smnTide)"/>
  <path d="M 11 1.5 L 38 1.5 L 38 38.5 L 11 38.5 L 1.5 20 Z" fill="url(#smnCap)"/>
  <path d="M 11 1.5 L 261 1.5 L 270.5 20 L 261 38.5 L 11 38.5 L 1.5 20 Z"
        fill="none" stroke="url(#smnSilver)" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="38" y1="3" x2="38" y2="37" stroke="url(#smnSilver)" stroke-width="1.4"/>

  <!-- Cadet crest: the parent's blades in silver, under a gold label -->
  <path d="M 21 9.5 L 29 12 L 29 22 Q 29 28 21 31.5 Q 13 28 13 22 L 13 12 Z"
        fill="#0b2f3a" stroke="#cbd5e1" stroke-width="1.3"/>
  <path d="M 17 18 L 25 27.5 M 25 18 L 17 27.5" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 15.5 14 L 26.5 14 M 17.5 14 L 17.5 16.6 M 21 14 L 21 16.6 M 24.5 14 L 24.5 16.6"
        stroke="#f0c46a" stroke-width="1.3" stroke-linecap="round"/>

  <text x="149" y="27" text-anchor="middle" fill="#e6f4f1"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="20" font-weight="700" letter-spacing="0.5" style="font-variant: small-caps">The Sub-Council</text>
</svg>
