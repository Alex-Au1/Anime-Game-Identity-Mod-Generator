name: Unit Tests

on:
  workflow_call:
    inputs:
      python-version:
        description: The python to test on
        type: string
        default: "3.12"

jobs:
  run-tests:
    name: Run Unit Tester
    runs-on: ubuntu-latest

    steps:
    # no Git LFS: the unit tests build their own fixtures and read nothing under Data/ or Mods/
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # pip installs the package from AGIDMGen/pyproject.toml, so its declared dependencies (numpy,
    #   FixRaidenBoss2 from PyPI) are what the tests run against, and the packaging itself is proved. The
    #   tester still imports the package from the SOURCE tree: test_ImportCheck fails if the installed copy
    #   is the one imported.
    - name: Install the package and its dependencies
      run: python -m pip install ./AGIDMGen

    - name: Install Tester Dependencies
      run: python -m pip install -r requirements.txt
      working-directory: './Testing/Unit Tester'

    # after every install, so a failure here is a dependency's and not a test's
    - name: Prove the dependencies import before testing anything
      run: python -c "import FixRaidenBoss2, AGRemapUtils.Utils.tests.BaseTestProgram; print('FixRaidenBoss2', FixRaidenBoss2.__file__)"

    - name: Run Unit Tests
      run: python main.py
      working-directory: './Testing/Unit Tester'
